steps:
  # 1. Recuperar o arquivo .env a partir do Google Secret Manager (secret: dotenv-pokedex)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=dotenv-pokedex > .env
        echo "✔ Arquivo .env carregado com sucesso a partir do Secret Manager."

  # 2. Instalar dependências da aplicação React e das Cloud Functions
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npm --prefix functions ci

  # 3. Sincronizar configurações, compilar Frontend e Backend, e fazer deploy no Firebase
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TARGET_PROJECT=$$(grep VITE_FIREBASE_PROJECT_ID .env | cut -d'=' -f2 | tr -d ' "\r\n')
        echo "🚀 Iniciando deploy completo para o projeto Firebase: $${TARGET_PROJECT}"
        node scripts/sync_firebase_config.js
        npm run build
        npm --prefix functions run build
        npx -y firebase-tools deploy --non-interactive --project "$${TARGET_PROJECT}"

options:
  logging: CLOUD_LOGGING_ONLY
