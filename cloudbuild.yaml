steps:
  # 1. Recuperar o arquivo .env do Secret Manager e gerar o token de autenticação do GCP
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=dotenv-pokedex > .env
        gcloud auth print-access-token > .gcp_token
        echo "✔ Arquivo .env e credencial de autenticação gerados com sucesso."

  # 2. Instalar dependências (Node.js 20 LTS)
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']

  # 3. Sincronizar configurações, compilar a aplicação e fazer deploy no Firebase
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        TARGET_PROJECT=$$(grep VITE_FIREBASE_PROJECT_ID .env | cut -d'=' -f2 | tr -d ' "\r\n')
        GCP_TOKEN=$$(cat .gcp_token)
        export CLOUDSDK_AUTH_ACCESS_TOKEN="$${GCP_TOKEN}"
        export FIREBASE_TOKEN="$${GCP_TOKEN}"
        
        echo "🚀 Iniciando deploy para o projeto Firebase: $${TARGET_PROJECT}"
        node scripts/sync_firebase_config.js
        npm run build
        npx -y firebase-tools deploy --non-interactive --project "$${TARGET_PROJECT}" --token "$${GCP_TOKEN}"

options:
  logging: CLOUD_LOGGING_ONLY
