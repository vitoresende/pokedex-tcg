steps:
  # 1. Recuperar o arquivo .env a partir do Google Secret Manager (secret: dotenv-pokedex)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=dotenv-pokedex > .env
        echo "✔ Arquivo .env carregado com sucesso a partir do Secret Manager."

  # 2. Instalar dependências (Node.js 20 LTS)
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']

  # 3. Sincronizar configurações, compilar a aplicação e fazer deploy no Firebase
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        node scripts/sync_firebase_config.js
        npm run build
        npx -y firebase-tools deploy --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY
