steps:
  # 1. Recuperar o arquivo .env a partir do Google Secret Manager (secret: dotenv-pokedex)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=dotenv-pokedex > .env
        echo "✔ Arquivo .env carregado com sucesso a partir do Secret Manager."

  # 2. Instalar dependências do projeto (Node.js 20 LTS)
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']

  # 3. Sincronizar configurações do Firebase e compilar o build de produção
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm run firebase:sync
        npm run build

  # 4. Executar o deploy automático dos serviços no Firebase
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npx -y firebase-tools deploy --non-interactive --project $$PROJECT_ID

options:
  logging: CLOUD_LOGGING_ONLY
