    <title>Pokédex TCG Master</title>

    <!-- Auto-unregister any stale Service Workers / PWA caches on localhost -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(var reg of registrations) {
            reg.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        });
      }
    </script>

  <body class="bg-pokedex-darker text-slate-100 min-h-screen antialiased selection:bg-pokedex-red selection:text-white">
    <div id="root"></div>

  </body>
